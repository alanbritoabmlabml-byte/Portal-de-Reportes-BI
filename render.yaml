# Blueprint de Render (https://render.com): con el repositorio en GitHub,
# «New → Blueprint» o el botón «Deploy to Render» del README levantan el
# servicio a partir de este archivo. El plan free basta para la demo; su disco
# es efímero, así que la base SQLite se vuelve a sembrar en cada despliegue.
services:
  - type: web
    name: portafolio-reportes-bi
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Portafolio de Reportes BI
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: portafolio-reportes-bi
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: es
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /app/database/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: TRUSTED_PROXIES
        value: "*"
